name: Publish the Python package to PyPI

# Publishes the app's own Python code (the package in src/) on PyPI at each release, with the version of the release: the same
# moment and the same version as the installers (release_constructor.yml).
#
# OFF BY DEFAULT: both jobs are skipped unless the repository variable PYPI_PUBLISH is
#   true      -> publish on PyPI (pypi.org)
#   testpypi  -> publish on TestPyPI (test.pypi.org), a trial
# No secret or token: PyPI trusted publishing. One-time setup (a pending trusted publisher on pypi.org for this workflow file and the
# environment "pypi", then the variable): .tools/docs/external_code_upload.md. To turn it off, delete the variable.

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build the package of src/
    if: vars.PYPI_PUBLISH == 'true' || vars.PYPI_PUBLISH == 'testpypi'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.build.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r .tools/requirements.txt build==1.3.0

      # The tag (v1.2.3 or 1.2.3) without the v. The checkout is the tagged commit, before the "Update version" commit of
      # release_constructor.yml: pypi_package.py writes this version into setup.py itself (not committed).
      - name: Build and check the package (nothing is uploaded yet)
        id: build
        env:
          TAG: ${{ github.event.release.tag_name }}
          PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
        run: python .tools/python/pypi_package.py --version "${TAG#v}" --index "$PYPI_PUBLISH" --outdir dist --github-output "$GITHUB_OUTPUT"

      - name: Store the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to ${{ vars.PYPI_PUBLISH == 'testpypi' && 'TestPyPI' || 'PyPI' }}
    needs: build
    if: vars.PYPI_PUBLISH == 'true' || vars.PYPI_PUBLISH == 'testpypi'
    runs-on: ubuntu-latest
    # The environment named in the trusted publisher on pypi.org (and test.pypi.org). GitHub creates it on the first run; protection
    # rules added to it (Settings > Environments > pypi), such as required reviewers, then apply to every upload.
    environment:
      name: pypi
      url: ${{ needs.build.outputs.url }}
    permissions:
      id-token: write  # trusted publishing: PyPI accepts a short-lived token that GitHub signs for this workflow and environment
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ vars.PYPI_PUBLISH == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
