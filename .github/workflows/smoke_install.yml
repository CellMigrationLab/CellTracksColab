# Builds the installer on each operating system (the same steps as the release workflow, but nothing is released), installs it
# silently as a plain user, and checks that the tools bridge is established: the hook registers the app, `list` and `doctor`
# are clean, a tool runs, and the worker leaves no process. On Linux/macOS it also runs the uninstall script.
name: Smoke install
on:
  workflow_dispatch:
  push:
    branches: [claude/smoke-install]

env:
  SMOKE_REF: claude/smoke-bridge  # branch of LabConstrictor-Tools that holds tests/smoke_bridge.py

jobs:
  build:
    name: Build installer (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os_name: linux, runner: ubuntu-latest }
          - { os_name: macos-arm64, runner: macos-15 }
          - { os_name: macos-intel, runner: macos-15-intel }
          - { os_name: windows, runner: windows-latest }
    defaults:
      run:
        shell: bash -l {0}
    env:
      CONSTRUCTOR_ENV: constructor-env
      OUTPUT_DIR: dist/${{ matrix.os_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: "3.11" }
      - run: pip install -r .tools/requirements.txt
      - name: Sync versioned files
        run: |
          RELEASE_VERSION="$(sed -n 's/^version: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' construct.yaml | head -1)"
          echo "version $RELEASE_VERSION"
          bash .tools/bash/run_with_context.sh "artifacts/log_${{ matrix.os_name }}.log" "bump_version.py" .tools/python/bump_version.py python .tools/python/bump_version.py "${RELEASE_VERSION}"
          bash .tools/bash/run_with_context.sh "artifacts/log_${{ matrix.os_name }}.log" "bump_constructor.py" .tools/python/bump_constructor.py python .tools/python/bump_constructor.py
          bash .tools/bash/run_with_context.sh "artifacts/log_${{ matrix.os_name }}.log" "bump_Welcome_notebook.py" .tools/python/bump_Welcome_notebook.py python .tools/python/bump_Welcome_notebook.py "${{ github.repository_owner }}" "${{ github.event.repository.name }}"
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate: true
          miniforge-version: latest
          use-mamba: true
      - name: Create constructor environment
        run: bash .tools/bash/create_constructor_environment.sh
      - name: Build installer with constructor
        run: bash .tools/bash/build_installer_with_constructor.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os_name }}
          path: dist/${{ matrix.os_name }}/*
          retention-days: 3
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os_name }}
          path: artifacts/
          if-no-files-found: ignore

  install:
    name: Install and check (${{ matrix.os_name }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os_name: linux, runner: ubuntu-latest }
          - { os_name: macos-arm64, runner: macos-15 }
          - { os_name: macos-intel, runner: macos-15-intel }
          - { os_name: windows, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer-${{ matrix.os_name }}
          path: installer

      - name: Install silently (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ls -la installer
          INSTALLER="$(ls installer/*.sh | head -1)"
          echo "installing $INSTALLER"
          time bash "$INSTALLER" -b -p "$HOME/ctc"
      - name: Install silently (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem installer | Format-Table Name, Length
          $exe = (Get-ChildItem installer\*.exe | Select-Object -First 1).FullName
          Write-Host "installing $exe"
          $p = Start-Process -FilePath $exe -ArgumentList '/InstallationType=JustMe','/RegisterPython=0','/S',"/D=$env:USERPROFILE\ctc" -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: The installer's own log
        if: always()
        shell: bash
        run: cat "$HOME/ctc/menuinst_debug.log" || echo "no menuinst_debug.log"
      - name: The hook registered the app
        shell: bash
        run: |
          grep -q "Tools registered" "$HOME/ctc/menuinst_debug.log" && echo "Tools registered: found" || { echo "FAIL: 'Tools registered' is not in menuinst_debug.log"; exit 1; }

      - name: Fetch the smoke script
        shell: bash
        run: curl -fsSL -o smoke_bridge.py "https://raw.githubusercontent.com/CellMigrationLab/LabConstrictor-Tools/${SMOKE_REF}/tests/smoke_bridge.py"
      - name: Bridge smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "$HOME/ctc/bin/python" smoke_bridge.py --app CellTracksColab --tool calculate_metrics --param tracks=lc_tests/fixtures/tracks.csv --bad-param tracks=/nonexistent/none.csv
      - name: Bridge smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$HOME/ctc/python.exe" smoke_bridge.py --app CellTracksColab --tool calculate_metrics --param tracks=lc_tests/fixtures/tracks.csv --bad-param tracks=C:/nonexistent/none.csv

      - name: Uninstall (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ENTRY="$HOME/.labconstrictor/apps/CellTracksColab.json"
          test -f "$ENTRY" && echo "registry entry present before uninstall" || echo "NOTE: registry entry missing before uninstall"
          bash "$HOME/ctc/uninstall.sh" 2> uninstall.err; echo "uninstall exit code $?"; cat uninstall.err
          test ! -d "$HOME/ctc" && echo "prefix removed" || { echo "FAIL: prefix still there"; exit 1; }
          test ! -f "$ENTRY" && echo "registry entry removed" || { echo "FAIL: registry entry still there"; exit 1; }
          ! grep -q WARNING uninstall.err || { echo "FAIL: uninstall printed a warning"; exit 1; }

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs-${{ matrix.os_name }}
          path: |
            ~/ctc/menuinst_debug.log
            ~/.labconstrictor/logs
          if-no-files-found: ignore
